<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Umeed — Admin</title><link rel="icon" type="image/jpeg" href="images/logo.jpeg"><link rel="apple-touch-icon" href="images/logo.jpeg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="umeedstyle.css"><style>
body{min-height:100vh}.admin-page{max-width:1120px;margin:0 auto;padding:62px 5%}.admin-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:38px}.admin-top h1{font:52px "Playfair Display",serif;margin:0}.store-link{color:var(--ink);font-size:12px;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px}.admin-card{background:#fff;padding:30px;box-shadow:0 8px 35px #1d211d0b}.admin-card h2{font:28px "Playfair Display",serif;margin:0 0 20px}.admin-form{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:end}.admin-field label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.admin-field input{width:100%;padding:12px;border:1px solid var(--line);background:var(--paper);outline:0}.file-field{grid-column:span 2}.admin-submit{border:0;background:var(--ink);color:#fff;padding:13px;cursor:pointer}.inventory{margin-top:45px}.inventory-table{width:100%;border-collapse:collapse;font-size:12px}.inventory-table th{color:var(--muted);font-size:10px;text-align:left;text-transform:uppercase;letter-spacing:.1em;font-weight:500}.inventory-table td,.inventory-table th{padding:15px 10px;border-bottom:1px solid var(--line)}.inventory-table img{width:43px;height:52px;object-fit:cover;vertical-align:middle;margin-right:10px}.stock-input{width:72px;padding:8px;border:1px solid var(--line)}.action-btn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:11px}.delete-btn{color:#a84738}.status{color:var(--muted);font-size:12px;margin-top:12px}.order-row{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);font-size:12px}.order-row p{color:var(--muted);margin:5px 0}.order-row select{display:block;margin-top:8px;padding:7px;border:1px solid var(--line);background:var(--paper);font-size:11px}@media(max-width:700px){.admin-top h1{font-size:38px}.admin-form{grid-template-columns:1fr 1fr}.file-field{grid-column:span 2}.inventory{overflow:auto}.inventory-table{min-width:600px}}
</style></head>
<body><div class="announcement">Umeed studio / inventory management</div><header class="main-header"><a class="logo" href="index.html" aria-label="Umeed home"><img src="images/logo.jpeg" alt="Umeed logo"><span class="brand-wordmark">umeed</span></a><a class="store-link" href="index.html">← Back to store</a></header><main class="admin-page"><div class="admin-top"><div><p class="eyebrow">Private workspace</p><h1>Inventory studio</h1></div></div><section id="login-section" class="admin-card"><h2>Sign in to continue</h2><form id="login-form" class="admin-form"><div class="admin-field"><label for="username">Username</label><input id="username" required autocomplete="username"></div><div class="admin-field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="admin-submit" type="submit">Enter studio →</button></form><p id="login-status" class="status"></p></section><section id="manage-section" class="hidden"><div class="admin-card"><h2>Add a new piece</h2><form id="productForm" class="admin-form" enctype="multipart/form-data"><div class="admin-field"><label for="title">Product name</label><input id="title" placeholder="e.g. Linen Hour Shirt" required></div><div class="admin-field"><label for="price">Price (Rs.)</label><input id="price" type="number" min="0" required></div><div class="admin-field"><label for="category">Category</label><input id="category" placeholder="Shirts" required></div><div class="admin-field"><label for="stock">Opening stock</label><input id="stock" type="number" min="0" required></div><div class="admin-field"><label for="description">Short description</label><input id="description" placeholder="Soft cotton, relaxed fit"></div><div class="admin-field"><label for="sizes">Sizes</label><input id="sizes" placeholder="S, M, L, XL"></div><div class="admin-field file-field"><label for="image">Product image</label><input id="image" type="file" accept="image/*" required></div><button class="admin-submit" type="submit">Publish piece →</button></form><p id="form-status" class="status"></p></div><div class="admin-card inventory"><h2>Live inventory</h2><div id="admin-product-list"></div></div><div class="admin-card inventory"><h2>Customer orders</h2><div id="order-notify" class="status order-notify hidden"></div><div id="admin-order-list"></div></div></section></main><script src="admin.js"></script></body></html>
